# Local development stack. Grows with each milestone (postgres, worker, api, mock LLM).
services:
  temporal:
    image: temporalio/temporal:latest
    command: ["server", "start-dev", "--ip", "0.0.0.0", "--headless"]
    ports: ["7233:7233"]

  crawler:
    build:
      context: ../..
      dockerfile: deploy/docker/crawler.Dockerfile
    depends_on: [temporal]
    environment:
      CRAWLER_TEMPORAL_ADDRESS: temporal:7233
      CRAWLER_TEMPORAL_NAMESPACE: default
      CRAWLER_PER_DOMAIN_INTERVAL_S: "2"
    read_only: true
    tmpfs: [/tmp]
    cap_drop: [ALL]
    security_opt: ["no-new-privileges:true"]
  crawler-render:  # optional: docker compose --profile render up
    build:
      context: ../..
      dockerfile: deploy/docker/crawler.Dockerfile
      target: render
    depends_on: [temporal]
    environment:
      CRAWLER_TEMPORAL_ADDRESS: temporal:7233
      CRAWLER_TEMPORAL_NAMESPACE: default
      CRAWLER_PER_DOMAIN_INTERVAL_S: "2"
      CRAWLER_MODE: render
    profiles: [render]
    shm_size: 512m
    read_only: true
    tmpfs: [/tmp]
    cap_drop: [ALL]
    security_opt: ["no-new-privileges:true"]
