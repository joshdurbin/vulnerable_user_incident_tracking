{{- $sel := dict "ctx" . "component" "web" }}
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "ct.fullname" . }}-web
  labels:
    {{- include "ct.labels" . | nindent 4 }}
    app.kubernetes.io/component: web
spec:
  replicas: {{ .Values.web.replicas }}
  selector:
    matchLabels:
      {{- include "ct.selector" $sel | nindent 6 }}
  template:
    metadata:
      labels:
        {{- include "ct.labels" . | nindent 8 }}
        app.kubernetes.io/component: web
    spec:
      automountServiceAccountToken: false
      securityContext:
        {{- include "ct.podSecurity" . | nindent 8 }}
      {{- include "ct.antiAffinity" $sel | nindent 6 }}
      containers:
        - name: web
          image: {{ include "ct.image" (dict "ctx" . "image" .Values.image.web "name" "web") }}
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          env:
            - { name: API_UPSTREAM, value: "http://{{ include "ct.fullname" . }}-api:8080" }
            - { name: TEMPORAL_UI_URL, value: {{ .Values.temporal.uiUrl | quote }} }
            - { name: TEMPORAL_NAMESPACE, value: {{ .Values.temporal.namespace | quote }} }
          ports:
            - { name: http, containerPort: 8080 }
          readinessProbe:
            httpGet: { path: /config.json, port: http }
            periodSeconds: 10
          livenessProbe:
            httpGet: { path: /, port: http }
            periodSeconds: 20
          resources:
            {{- toYaml .Values.web.resources | nindent 12 }}
          # No read-only root filesystem: the nginx entrypoint renders its config and
          # config.json at start. It still runs as a non-root user with no capabilities.
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop: [ALL]
---
apiVersion: v1
kind: Service
metadata:
  name: {{ include "ct.fullname" . }}-web
  labels:
    {{- include "ct.labels" . | nindent 4 }}
    app.kubernetes.io/component: web
spec:
  selector:
    {{- include "ct.selector" $sel | nindent 4 }}
  ports:
    - { name: http, port: 8080, targetPort: http }
{{- if .Values.web.ingress.enabled }}
---
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: {{ include "ct.fullname" . }}
  labels:
    {{- include "ct.labels" . | nindent 4 }}
  {{- with .Values.web.ingress.annotations }}
  annotations:
    {{- toYaml . | nindent 4 }}
  {{- end }}
spec:
  ingressClassName: {{ .Values.web.ingress.className }}
  tls:
    - hosts: [{{ .Values.web.ingress.host }}]
  rules:
    - http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: {{ include "ct.fullname" . }}-web
                port: { number: 8080 }
{{- end }}
---
apiVersion: policy/v1
kind: PodDisruptionBudget
metadata:
  name: {{ include "ct.fullname" . }}-web
  labels:
    {{- include "ct.labels" . | nindent 4 }}
spec:
  maxUnavailable: 1
  selector:
    matchLabels:
      {{- include "ct.selector" $sel | nindent 6 }}
