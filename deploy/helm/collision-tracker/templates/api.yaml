{{- $sel := dict "ctx" . "component" "api" }}
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "ct.fullname" . }}-api
  labels:
    {{- include "ct.labels" . | nindent 4 }}
    app.kubernetes.io/component: api
spec:
  replicas: {{ .Values.api.replicas }}
  selector:
    matchLabels:
      {{- include "ct.selector" $sel | nindent 6 }}
  template:
    metadata:
      labels:
        {{- include "ct.labels" . | nindent 8 }}
        app.kubernetes.io/component: api
    spec:
      automountServiceAccountToken: false
      securityContext:
        {{- include "ct.podSecurity" . | nindent 8 }}
      {{- include "ct.antiAffinity" $sel | nindent 6 }}
      containers:
        - name: api
          image: {{ include "ct.image" (dict "ctx" . "image" .Values.image.collisionctl "name" "collisionctl") }}
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          args: ["api"]
          env:
            {{- include "ct.env" . | nindent 12 }}
            {{- include "ct.searchEnv" . | nindent 12 }}
            - name: COLLISION_API_LISTEN
              value: ":8080"
            - name: COLLISION_METRICS_LISTEN
              value: ":9100"
            {{- if .Values.sources.seed }}
            - name: COLLISION_SOURCES_SEED_FILE
              value: /etc/collision-seed/sources.yaml
            {{- else }}
            - name: COLLISION_SOURCES_SEED_FILE
              value: {{ .Values.sources.seedFile | quote }}
            {{- end }}
            - name: COLLISION_API_ADMIN_TOKEN
              valueFrom: { secretKeyRef: { name: {{ .Values.secrets.adminToken.name }}, key: {{ .Values.secrets.adminToken.key }}, optional: true } }
          ports:
            - { name: http, containerPort: 8080 }
            - { name: metrics, containerPort: 9100 }
          readinessProbe:
            httpGet: { path: /readyz, port: http }
            periodSeconds: 10
          livenessProbe:
            httpGet: { path: /healthz, port: http }
            periodSeconds: 20
          resources:
            {{- toYaml .Values.api.resources | nindent 12 }}
          securityContext:
            {{- include "ct.containerSecurity" . | nindent 12 }}
          {{- if .Values.sources.seed }}
          volumeMounts:
            - { name: seed, mountPath: /etc/collision-seed, readOnly: true }
          {{- end }}
      {{- if .Values.sources.seed }}
      volumes:
        - name: seed
          configMap: { name: {{ include "ct.fullname" . }}-sources }
      {{- end }}
{{- if .Values.sources.seed }}
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ include "ct.fullname" . }}-sources
  labels:
    {{- include "ct.labels" . | nindent 4 }}
data:
  sources.yaml: |
    {{- .Values.sources.seed | nindent 4 }}
{{- end }}
---
apiVersion: v1
kind: Service
metadata:
  name: {{ include "ct.fullname" . }}-api
  labels:
    {{- include "ct.labels" . | nindent 4 }}
    app.kubernetes.io/component: api
spec:
  selector:
    {{- include "ct.selector" $sel | nindent 4 }}
  ports:
    - { name: http, port: 8080, targetPort: http }
---
apiVersion: policy/v1
kind: PodDisruptionBudget
metadata:
  name: {{ include "ct.fullname" . }}-api
  labels:
    {{- include "ct.labels" . | nindent 4 }}
spec:
  maxUnavailable: 1
  selector:
    matchLabels:
      {{- include "ct.selector" $sel | nindent 6 }}
