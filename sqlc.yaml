version: "2"
sql:
  - engine: postgresql
    schema: db/migrations
    queries: db/queries
    gen:
      go:
        package: dbgen
        out: internal/storage/dbgen
        sql_package: pgx/v5
        emit_json_tags: true
        emit_pointers_for_null_types: true
        overrides:
          - db_type: uuid
            go_type: github.com/google/uuid.UUID
          - db_type: uuid
            nullable: true
            go_type: { import: github.com/google/uuid, type: UUID, pointer: true }
          - db_type: timestamptz
            go_type: time.Time
          - db_type: timestamptz
            nullable: true
            go_type: { type: time.Time, pointer: true }
          - db_type: date
            nullable: true
            go_type: { type: time.Time, pointer: true }
          - column: incidents_v.lat
            go_type: { type: float64, pointer: true }
          - column: incidents_v.lon
            go_type: { type: float64, pointer: true }
          - db_type: pg_catalog.numeric
            go_type: float64
