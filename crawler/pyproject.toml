[project]
name = "collision-crawler"
version = "0.1.0"
description = "Temporal worker for crawling and article extraction"
requires-python = ">=3.12"
dependencies = [
  "temporalio>=1.9",
  "httpx>=0.28",
  "trafilatura>=2.0",
  "lxml>=5.3",
  "beautifulsoup4>=4.12",
]

[project.optional-dependencies]
browser = ["playwright>=1.49"]  # only the render image installs this

[dependency-groups]
dev = ["pytest>=8", "pytest-asyncio>=0.24", "respx>=0.22", "playwright>=1.49"]

[project.scripts]
collision-crawler = "collision_crawler.worker:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/collision_crawler"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
