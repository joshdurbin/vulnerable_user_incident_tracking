[project]
name = "collision-crawler"
version = "0.1.0"
description = "Stateless gRPC crawling and article-extraction service"
requires-python = ">=3.12"
dependencies = [
  "grpcio>=1.70",
  "protobuf>=5.29",
  "httpx>=0.28",
  "trafilatura>=2.0",
  "lxml>=5.3",
  "beautifulsoup4>=4.12",
]

[project.optional-dependencies]
browser = ["playwright>=1.49"]

[dependency-groups]
dev = ["pytest>=8", "pytest-asyncio>=0.24", "grpcio-tools>=1.70", "respx>=0.22"]

[project.scripts]
collision-crawler = "collision_crawler.server:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/collision_crawler"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
