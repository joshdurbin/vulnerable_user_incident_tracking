name: ci
on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with: { go-version-file: go.mod }
      - uses: astral-sh/setup-uv@v5
      - run: go vet ./... && go test ./...
      - uses: azure/setup-helm@v4
      - name: helm chart
        run: make helm-check
      - uses: actions/setup-node@v4
        with: { node-version: 22, cache: npm, cache-dependency-path: web/package-lock.json }
      - name: generated code is up to date
        run: |
          (cd web && npm ci)
          go install github.com/sqlc-dev/sqlc/cmd/sqlc@v1.31.1
          make generate
          git diff --exit-code
      - name: crawler (including the real-browser renderer tests)
        run: |
          cd crawler
          uv run --python 3.13 playwright install --with-deps --only-shell chromium
          uv run --python 3.13 pytest -q
      - name: web
        run: |
          cd web
          npm run build
          npm test

  images:
    needs: test
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    permissions: { contents: read, packages: write }
    strategy:
      matrix:
        include:
          - { name: crawler, file: deploy/docker/crawler.Dockerfile, args: "", target: crawl }
          - { name: crawler-render, file: deploy/docker/crawler.Dockerfile, args: "", target: render }
          - { name: collisionctl, file: deploy/docker/go.Dockerfile, args: "CMD=collisionctl", target: "" }
          - { name: web, file: deploy/docker/web.Dockerfile, args: "", target: "" }
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-qemu-action@v3
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with: { registry: ghcr.io, username: "${{ github.actor }}", password: "${{ secrets.GITHUB_TOKEN }}" }
      - uses: docker/build-push-action@v6
        with:
          context: .
          file: ${{ matrix.file }}
          build-args: ${{ matrix.args }}
          target: ${{ matrix.target }}
          platforms: linux/amd64,linux/arm64
          push: true
          tags: |
            ghcr.io/${{ github.repository }}/${{ matrix.name }}:${{ github.sha }}
            ghcr.io/${{ github.repository }}/${{ matrix.name }}:latest
          cache-from: type=gha,scope=${{ matrix.name }}
          cache-to: type=gha,scope=${{ matrix.name }},mode=max
