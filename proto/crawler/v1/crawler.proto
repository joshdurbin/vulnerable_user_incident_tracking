syntax = "proto3";

package crawler.v1;

import "google/protobuf/duration.proto";
import "google/protobuf/timestamp.proto";

option go_package = "github.com/joshdurbin/fuck_cars/gen/crawler/v1;crawlerv1";

// CrawlerService fetches and parses untrusted web content. It owns no
// business logic and no persistence.
service CrawlerService {
  // FetchArticle retrieves one URL and extracts readable article content.
  rpc FetchArticle(FetchArticleRequest) returns (FetchArticleResponse);
  // DiscoverLinks performs a bounded crawl from a seed URL.
  rpc DiscoverLinks(DiscoverLinksRequest) returns (DiscoverLinksResponse);
}

enum RenderingPolicy {
  RENDERING_POLICY_UNSPECIFIED = 0;
  // HTTP only; never launch a browser.
  RENDERING_POLICY_HTTP_ONLY = 1;
  // HTTP first, fall back to browser rendering when extraction fails.
  RENDERING_POLICY_AUTO = 2;
  // Always render in a browser.
  RENDERING_POLICY_ALWAYS = 3;
}

enum ExtractionStatus {
  EXTRACTION_STATUS_UNSPECIFIED = 0;
  EXTRACTION_STATUS_OK = 1;
  // Fetched, but no article text could be extracted.
  EXTRACTION_STATUS_NO_CONTENT = 2;
  // Fetch failed (network, HTTP error, timeout).
  EXTRACTION_STATUS_FETCH_FAILED = 3;
  // URL rejected by security policy (SSRF, scheme, domain).
  EXTRACTION_STATUS_BLOCKED = 4;
  // Disallowed by robots.txt.
  EXTRACTION_STATUS_ROBOTS_DISALLOWED = 5;
  // Response was not an HTML/text document or exceeded the size limit.
  EXTRACTION_STATUS_UNSUPPORTED = 6;
}

message FetchArticleRequest {
  string url = 1;
  RenderingPolicy rendering_policy = 2;
  string source_id = 3;
  google.protobuf.Duration timeout = 4;
  // Correlation identifier propagated from the caller for log tracing.
  string correlation_id = 5;
}

message FetchArticleResponse {
  string requested_url = 1;
  string final_url = 2;
  string canonical_url = 3;
  string title = 4;
  string publisher = 5;
  string author = 6;
  google.protobuf.Timestamp published_at = 7;
  string text = 8;
  string description = 9;
  string language = 10;
  int32 http_status = 11;
  string content_type = 12;
  google.protobuf.Timestamp fetched_at = 13;
  bool rendered = 14;
  ExtractionStatus extraction_status = 15;
  string error_detail = 16;
}

message DiscoverLinksRequest {
  string seed_url = 1;
  repeated string allowed_domains = 2;
  // Regular expressions a discovered URL must match (any). Empty = all.
  repeated string url_patterns = 3;
  int32 max_pages = 4;
  int32 max_depth = 5;
  google.protobuf.Duration max_duration = 6;
  RenderingPolicy rendering_policy = 7;
  string correlation_id = 8;
}

message DiscoveredLink {
  string url = 1;
  string title = 2;
  string found_on = 3;
  int32 depth = 4;
}

message DiscoverLinksResponse {
  repeated DiscoveredLink links = 1;
  int32 pages_fetched = 2;
  // True if a limit (pages, depth, duration) stopped the crawl early.
  bool truncated = 3;
  string error_detail = 4;
}
